<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Manager - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="flex items-center justify-center mb-6">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center mr-3">
                    <i class="fas fa-shield-alt text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">VPN Manager</h1>
                    <p class="text-sm text-gray-500">Login or register to manage your own Worker tunnels</p>
                </div>
            </div>

            <div class="flex mb-4 border-b border-gray-200">
                <button id="tabLogin" class="flex-1 py-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600">
                    Login
                </button>
                <button id="tabRegister" class="flex-1 py-2 text-sm font-semibold text-gray-500 hover:text-gray-700">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="loginIdentifier" class="block text-sm font-medium text-gray-700 mb-1">
                        Email or Username
                    </label>
                    <input
                        id="loginIdentifier"
                        type="text"
                        autocomplete="username"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="you@example.com or vortex-user-1"
                        required
                    >
                </div>

                <div>
                    <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Password
                    </label>
                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="w-full mt-2 px-4 py-2 bg-blue-600 text-white rounded-md font-semibold hover:bg-blue-700 transition-colors"
                >
                    Login
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-4 hidden mt-4">
                <div>
                    <label for="registerEmail" class="block text-sm font-medium text-gray-700 mb-1">
                        Email
                    </label>
                    <input
                        id="registerEmail"
                        type="email"
                        autocomplete="email"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div>
                    <label for="registerUsername" class="block text-sm font-medium text-gray-700 mb-1">
                        Username
                    </label>
                    <input
                        id="registerUsername"
                        type="text"
                        autocomplete="username"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="vortex-user-1"
                        required
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        This username will be used to separate your Worker tunnels from other users.
                    </p>
                </div>

                <div>
                    <label for="registerPassword" class="block text-sm font-medium text-gray-700 mb-1">
                        Password
                    </label>
                    <input
                        id="registerPassword"
                        type="password"
                        autocomplete="new-password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="At least 6 characters"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="w-full mt-2 px-4 py-2 bg-green-600 text-white rounded-md font-semibold hover:bg-green-700 transition-colors"
                >
                    Create Account
                </button>
            </form>

            <p id="currentUserHint" class="mt-4 text-xs text-gray-500 hidden">
                Current user: <span id="currentUserLabel" class="font-semibold"></span>.
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
