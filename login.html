<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Manager - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="flex items-center justify-center mb-6">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center mr-3">
                    <i class="fas fa-shield-alt text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">VPN Manager</h1>
                    <p class="text-sm text-gray-500">Enter a username to start using the dashboard</p>
                </div>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="usernameInput" class="block text-sm font-medium text-gray-700 mb-1">
                        Username
                    </label>
                    <input
                        id="usernameInput"
                        type="text"
                        autocomplete="off"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="e.g. vortex-user-1"
                        required
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        This ID will be used to separate your Worker tunnels from other users.
                    </p>
                </div>

                <button
                    type="submit"
                    class="w-full mt-2 px-4 py-2 bg-blue-600 text-white rounded-md font-semibold hover:bg-blue-700 transition-colors"
                >
                    Continue
                </button>
            </form>

            <p id="currentUserHint" class="mt-4 text-xs text-gray-500 hidden">
                Current user: <span id="currentUserLabel" class="font-semibold"></span>.
                Submitting a new username will switch to that user.
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
